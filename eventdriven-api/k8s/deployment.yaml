apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdriven-api
  labels:
    app: eventdriven-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventdriven-api
  template:
    metadata:
      labels:
        app: eventdriven-api
    spec:
      containers:
        - name: eventdriven-api
          image: fsalazar2202/eventdriven-api:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventdriven-api-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eventdriven-api-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventdriven-api-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
